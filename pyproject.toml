[project]
name = "drf-fast-output"
version = "0.2.0"
description = "Faster output serialization for Django REST Framework read endpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marco Peyfuss", email = "82735893+mpeyfuss@users.noreply.github.com" }
]
keywords = ["django", "djangorestframework", "drf", "serializer", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.15",
]

[project.urls]
Homepage = "https://github.com/mpeyfuss/drf-fast-output"
Repository = "https://github.com/mpeyfuss/drf-fast-output"
Issues = "https://github.com/mpeyfuss/drf-fast-output/issues"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.0.9",
    "djangorestframework-stubs>=3.18.0",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-formatted README examples

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PERF",     # perf anti-patterns
    "PIE",
    "PT",       # pytest style
    "DJ",       # django
]

ignore = [
    "RUF012",   # mutable class attrs: Django/DRF `Meta.fields = [...]` is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "DJ",       # test models don't need __str__ etc.
    "B018",     # `serializer.data` accessed for its side effects
    "PT011",    # broad pytest.raises is fine where messages are compared after
]
"benchmarks/**" = ["DJ"]

[tool.pyrefly]
project-includes = ["drf_fast_output", "tests", "benchmarks"]
python-version = "3.10"
