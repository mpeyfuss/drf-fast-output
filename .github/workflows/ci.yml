name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by publish.yml so a release can't skip tests

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # Every supported Django and DRF minor version. Each Django minor runs on the newest
  # Python and DRF it supports; each older DRF minor runs on the newest Django it supports.
  test-compat:
    name: Django ${{ matrix.django }} / DRF ${{ matrix.drf }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", django: "4.2", drf: "3.15" }  # minimum supported
          - { python-version: "3.12", django: "4.2", drf: "3.17" }
          - { python-version: "3.12", django: "5.0", drf: "3.15" }
          - { python-version: "3.12", django: "5.0", drf: "3.17" }
          - { python-version: "3.13", django: "5.1", drf: "3.17" }
          - { python-version: "3.13", django: "5.2", drf: "3.16" }
          - { python-version: "3.14", django: "5.2", drf: "3.18" }
          - { python-version: "3.14", django: "6.0", drf: "3.17" }
          - { python-version: "3.14", django: "6.0", drf: "3.18" }
          - { python-version: "3.15", django: "6.1", drf: "3.18" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install "django~=${{ matrix.django }}.0" "djangorestframework~=${{ matrix.drf }}.0"
      - run: uv run --no-sync pytest
